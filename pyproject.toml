[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dodo-agent-python"
version = "0.1.0"
description = "Python/LangGraph migration of Dodo Agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langchain[mcp]>=1.4,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.12,<1",
    "redis>=5,<9",
    "sqlalchemy>=2.0,<3",
    "asyncmy>=0.2,<1",
    "minio>=7.2,<8",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
